<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องมือวิเคราะห์การถดถอย OLS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#5d6679;--bd:#dde2ee;--pr:#2f5bea;--prt:#fff;--ok:#16794a;--bad:#c0392b;--warn:#b7791f;--th:#eaeffc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2f3748;--pr:#6b8cff;--prt:#0b1020;--ok:#4cd08d;--bad:#ff7b6b;--warn:#f0b955;--th:#262e42}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2f3748;--pr:#6b8cff;--prt:#0b1020;--ok:#4cd08d;--bad:#ff7b6b;--warn:#f0b955;--th:#262e42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun",system-ui,sans-serif;line-height:1.65;font-size:16px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:0 0 .6em}h3{font-size:1.02rem;margin:1em 0 .4em}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.step{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--pr);color:var(--prt);align-items:center;justify-content:center;font-size:.85rem;margin-right:8px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button:hover{border-color:var(--pr)}
button.on{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.main{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:700;padding:11px 24px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file],select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;margin:3px}
.hint{color:var(--mu);font-size:.9rem}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:right;white-space:nowrap}
th{background:var(--th)}th:first-child,td:first-child{text-align:left}
.expl{background:var(--bg);border-left:4px solid var(--pr);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.95rem}
.expl p{margin:.4em 0}
.good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}.warnc{color:var(--warn);font-weight:600}
.chartbox{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:8px;height:430px;position:relative;overflow-x:auto}
.chartbox canvas{max-width:100%}
.err{color:var(--bad);font-weight:600;margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="row" style="justify-content:flex-end"><button id="lgTH" class="on">ไทย</button><button id="lgEN">English</button></div>
<h1>📈 <span data-th="วิเคราะห์การถดถอยเชิงพหุ (OLS)" data-en="Multiple Regression Analysis (OLS)"></span></h1>
<p class="sub" data-th="วิเคราะห์ Ordinary Least Squares จากไฟล์ Excel พร้อมตารางสถิติ คำอธิบาย การตรวจข้อตกลงเบื้องต้น และกราฟ ข้อมูลประมวลผลในเบราว์เซอร์เท่านั้น" data-en="Ordinary Least Squares analysis from your Excel file, with statistical tables, explanations, assumption checks and charts. All data is processed in your browser only."></p>

<div class="card"><h2><span class="step">1</span><span data-th="เลือกการวิเคราะห์" data-en="Select the analysis"></span></h2>
<div class="row" id="testBtns">
<button data-t="ols"><span data-th="ผลการถดถอย OLS" data-en="OLS regression results"></span></button>
<button data-t="diag"><span data-th="การตรวจข้อตกลง / Residual" data-en="Assumptions / residual diagnostics"></span></button>
<button data-t="all" class="on"><span data-th="ทั้งหมด" data-en="Everything"></span></button>
</div></div>

<div class="card"><h2><span class="step">2</span><span data-th="แนบไฟล์ข้อมูล Excel" data-en="Upload your Excel data file"></span></h2>
<input type="file" id="file" accept=".xlsx,.xls,.csv">
<p class="hint" data-th="แถวแรกเป็นชื่อตัวแปร ข้อมูลเป็นตัวเลข (อ่านจากชีตแรก) รองรับ .xlsx .xls .csv" data-en="The first row must contain variable names and the data must be numeric (first sheet is read). Supports .xlsx .xls .csv"></p>
<div class="row"><button id="sampleBtn" data-th="🧪 ทดสอบด้วยข้อมูลตัวอย่าง" data-en="🧪 Try with sample data"></button><button id="sampleDl" data-th="⬇ ดาวน์โหลดไฟล์ Excel ตัวอย่าง" data-en="⬇ Download sample Excel file"></button></div>
<p class="hint" data-th="ข้อมูลตัวอย่าง 60 แถว: คะแนนสอบ (Y) กับชั่วโมงอ่านหนังสือ การเข้าเรียน ชั่วโมงนอน และเกรดก่อนหน้า (X)" data-en="Sample data, 60 rows: exam score (Y) with study hours, attendance, sleep hours and previous GPA (X)."></p>
<div id="varBox" class="hide">
<h3 data-th="เลือกตัวแปร" data-en="Select variables"></h3>
<div><span data-th="ตัวแปรตาม (Y):" data-en="Dependent variable (Y):"></span> <select id="ySel"></select></div>
<div style="margin-top:8px"><span data-th="ตัวแปรอิสระ (X):" data-en="Independent variables (X):"></span> <span id="xBox"></span></div>
<p class="hint" id="fileInfo"></p>
</div></div>

<div class="card"><h2><span class="step">3</span><span data-th="ประมวลผล" data-en="Process"></span></h2>
<div class="row"><button class="main" id="runBtn" disabled data-th="▶ ประมวลผล" data-en="▶ Process"></button><button class="danger" id="resetBtn" data-th="⟲ Reset หน้า" data-en="⟲ Reset page"></button></div>
<div class="err" id="err"></div></div>

<div id="out" class="hide">
<div class="card" id="secDesc"></div>
<div class="card" id="secOls"></div>
<div class="card" id="secDiag"></div>
<div class="card"><h2 data-th="ดาวน์โหลดผลลัพธ์" data-en="Download results"></h2><button class="main" id="xlsBtn" data-th="⬇ ดาวน์โหลดตารางเป็น Excel (.xlsx)" data-en="⬇ Download tables as Excel (.xlsx)"></button></div>
<div class="card"><h2 data-th="กราฟ" data-en="Charts"></h2><p class="hint" data-th="เลือกกราฟที่ต้องการดู" data-en="Choose a chart to view"></p>
<div class="row" id="chartBtns"></div>
<div class="chartbox" style="margin-top:12px" id="chartBox"></div>
<div class="expl" id="chartExpl"></div>
<button class="main" id="pngBtn" data-th="⬇ ดาวน์โหลดกราฟเป็น PNG" data-en="⬇ Download chart as PNG"></button></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={test:'all',headers:[],data:[],numCols:[],res:null,chart:null,chartKey:null,tables:{}};
const f=(x,d=4)=>x==null||!isFinite(x)?(x===Infinity?'∞':'-'):Number(x).toFixed(d);
const fp=p=>p==null||isNaN(p)?'-':(p<0.001?'<0.001':p.toFixed(4));

/* ---------- special functions ---------- */
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const v of c)s+=v/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gP(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,sum=1/a,del=sum;for(let n=0;n<500;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-14)break}return sum*Math.exp(-x+a*Math.log(x)-lgam(a))}
let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}return 1-Math.exp(-x+a*Math.log(x)-lgam(a))*h}
function bcf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-300)d=1e-300;d=1/d;let h=d;for(let m=1;m<500;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-300)d=1e-300;c=1+aa/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-300)d=1e-300;c=1+aa/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}return h}
function bI(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b}
const chiP=(x,df)=>x<=0?1:1-gP(df/2,x/2);
const fP=(F,d1,d2)=>F<=0?1:bI(d2/(d2+d1*F),d2/2,d1/2);
const tP=(t,df)=>bI(df/(df+t*t),df/2,.5);

/* ---------- linear algebra / OLS ---------- */
function inv(A){const n=A.length,M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>+(i===j))]);for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;if(Math.abs(M[p][i])<1e-11)return null;[M[i],M[p]]=[M[p],M[i]];const d=M[i][i];for(let j=0;j<2*n;j++)M[i][j]/=d;for(let r=0;r<n;r++)if(r!==i){const m=M[r][i];if(m)for(let j=0;j<2*n;j++)M[r][j]-=m*M[i][j]}}return M.map(r=>r.slice(n))}
function ols(X,y){const n=X.length,p=X[0].length;const XtX=Array.from({length:p},()=>Array(p).fill(0)),Xty=Array(p).fill(0);for(let i=0;i<n;i++)for(let a=0;a<p;a++){Xty[a]+=X[i][a]*y[i];for(let b=0;b<p;b++)XtX[a][b]+=X[i][a]*X[i][b]}
const I=inv(XtX);if(!I)return null;const beta=I.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0));const fit=X.map(r=>r.reduce((s,v,j)=>s+v*beta[j],0));const res=y.map((v,i)=>v-fit[i]);const my=y.reduce((a,b)=>a+b,0)/n;const SSE=res.reduce((s,e)=>s+e*e,0),SST=y.reduce((s,v)=>s+(v-my)*(v-my),0);const k=p-1,dfe=n-p;const R2=SST>0?1-SSE/SST:0;const MSE=SSE/dfe;const se=I.map((r,i)=>Math.sqrt(Math.max(MSE*r[i],0)));const t=beta.map((b,i)=>b/se[i]);const pv=t.map(v=>tP(v,dfe));const F=(R2/k)/((1-R2)/dfe);return{beta,fit,res,SSE,SST,R2,adj:1-(1-R2)*(n-1)/dfe,MSE,se,t,pv,F,pF:fP(F,k,dfe),k,dfe,n,my}}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
const corr=(a,b)=>{const ma=mean(a),mb=mean(b);let sab=0,saa=0,sbb=0;for(let i=0;i<a.length;i++){sab+=(a[i]-ma)*(b[i]-mb);saa+=(a[i]-ma)**2;sbb+=(b[i]-mb)**2}return sab/Math.sqrt(saa*sbb)};
function aux(cols,z){/* regress z on columns (with intercept); returns R2 and F info */const n=z.length;const X=Array.from({length:n},(_,i)=>[1,...cols.map(c=>c[i])]);const r=ols(X,z);if(!r)return null;return{R2:r.R2,q:cols.length,n,F:(r.R2/cols.length)/((1-r.R2)/(n-cols.length-1)),SSR:r.SST-r.SSE,SST:r.SST}}

/* ---------- language ---------- */
let LANG='th';const L=(th,en)=>LANG==='th'?th:en;
function applyStatic(){document.documentElement.lang=LANG;document.title=L('เครื่องมือวิเคราะห์การถดถอย OLS','OLS Regression Analysis Tool');document.querySelectorAll('[data-th]').forEach(e=>e.textContent=e.dataset[LANG])}
function setLang(l){LANG=l;$('lgTH').classList.toggle('on',l==='th');$('lgEN').classList.toggle('on',l==='en');applyStatic();updateInfo();if(S.res){const k=S.chartKey;render(S.res);if(S.charts.some(c=>c.k===k))showChart(k)}}
$('lgTH').onclick=()=>setLang('th');$('lgEN').onclick=()=>setLang('en');

/* ---------- UI: tests ---------- */
$('testBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.test=b.dataset.t;[...$('testBtns').children].forEach(x=>x.classList.toggle('on',x===b))};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t,bad){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:90%;padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.25)';document.body.appendChild(el)}el.textContent=t;el.style.background=bad?'#c0392b':'#16794a';el.style.color='#fff';el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',5000)}

/* ---------- file loading ---------- */
$('file').onchange=async e=>{const file=e.target.files[0];$('err').textContent='';if(!file)return;
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});loadRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,raw:true}),wb.SheetNames[0],false)}
  catch(x){$('err').textContent=L('อ่านไฟล์ไม่สำเร็จ: ','Could not read file: ')+x.message}};
function loadRows(rows,sheet,sample){
  try{
    if(rows.length<4)throw new Error(L('ข้อมูลน้อยเกินไป','Too little data'));
    const hd=rows[0].map((h,i)=>h==null||h===''?'Var'+(i+1):String(h));
    const data=rows.slice(1).filter(r=>r.some(v=>v!=null&&v!==''));
    const num=v=>{if(typeof v==='number')return v;if(typeof v==='string'&&v.trim()!==''&&isFinite(v.replace(/,/g,'')))return +v.replace(/,/g,'');return null};
    S.data=data.map(r=>hd.map((_,i)=>num(r[i])));S.headers=hd;
    S.numCols=hd.map((_,i)=>i).filter(i=>S.data.filter(r=>r[i]!=null).length>=0.7*data.length);
    if(S.numCols.length<2)throw new Error(L('ต้องมีคอลัมน์ตัวเลขอย่างน้อย 2 คอลัมน์','At least 2 numeric columns are required'));
    $('ySel').innerHTML=S.numCols.map(i=>`<option value="${i}">${esc(hd[i])}</option>`).join('');
    $('ySel').value=S.numCols[0];buildX();
    S.info={rows:data.length,cols:S.numCols.length,sheet,sample};updateInfo();
    $('varBox').classList.remove('hide');$('runBtn').disabled=false;
  }catch(x){$('err').textContent=L('อ่านไฟล์ไม่สำเร็จ: ','Could not read file: ')+x.message;$('varBox').classList.add('hide');$('runBtn').disabled=true}
}
function updateInfo(){const i=S.info;if(!i)return;$('fileInfo').textContent=L(`อ่านข้อมูลสำเร็จ: ${i.rows} แถว, ${i.cols} คอลัมน์ตัวเลข (ชีต: ${i.sheet})`,`Loaded: ${i.rows} rows, ${i.cols} numeric columns (sheet: ${i.sheet})`)+(i.sample?L(' ใช้ข้อมูลตัวอย่าง กดประมวลผลได้เลย',' Sample data in use; just press Process'):'')}
function buildX(){const y=+$('ySel').value;$('xBox').innerHTML=S.numCols.filter(i=>i!==y).map(i=>`<label class="chk"><input type="checkbox" value="${i}" checked>${esc(S.headers[i])}</label>`).join('')}
$('ySel').onchange=buildX;

/* ---------- OLS-specific ---------- */
function qnorm(p){const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];const pl=0.02425;if(p<pl){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}if(p>1-pl){const q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}const q=p-.5,r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
function tcrit(df){let lo=0,hi=1000;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(tP(m,df)>0.05)lo=m;else hi=m}return(lo+hi)/2}
function analyze(){
  const yi=+$('ySel').value,xi=[...$('xBox').querySelectorAll('input:checked')].map(c=>+c.value);
  if(!xi.length)throw new Error(L('กรุณาเลือกตัวแปรอิสระอย่างน้อย 1 ตัว','Please select at least 1 independent variable'));
  const rows=S.data.filter(r=>[yi,...xi].every(i=>r[i]!=null));const n=rows.length,k=xi.length;
  if(n<k+3)throw new Error(L(`จำนวนข้อมูลที่สมบูรณ์ (${n}) น้อยเกินไปสำหรับตัวแปร ${k} ตัว`,`Complete cases (${n}) are too few for ${k} predictors`));
  const y=rows.map(r=>r[yi]),xs=xi.map(i=>rows.map(r=>r[i])),names=xi.map(i=>S.headers[i]),yn=S.headers[yi];
  const X=rows.map((_,r)=>[1,...xs.map(c=>c[r])]);const m=ols(X,y);
  if(!m)throw new Error(L('ไม่สามารถประมาณสมการถดถอยได้ (ตัวแปรอิสระอาจสัมพันธ์กันสมบูรณ์หรือมีค่าคงที่)','Cannot estimate the regression (predictors may be perfectly collinear or constant)'));
  const p=k+1,XtX=Array.from({length:p},(_,a)=>Array.from({length:p},(_,b)=>X.reduce((s,r)=>s+r[a]*r[b],0)));const I=inv(XtX);
  const h=X.map(r=>{let s=0;for(let a=0;a<p;a++)for(let b=0;b<p;b++)s+=r[a]*I[a][b]*r[b];return s});
  const o={n,k,p,yn,names,y,xs,m,h,dropped:S.data.length-n};
  o.desc=[yn,...names].map((nm,j)=>{const a=j?xs[j-1]:y;return{nm,n,mean:mean(a),sd:sd(a),min:Math.min(...a),max:Math.max(...a)}});
  const all=[y,...xs];o.cn=[yn,...names];o.cm=all.map(a=>all.map(b=>corr(a,b)));
  const tc=tcrit(m.dfe),sy=sd(y);
  o.vif=xs.map((c,j)=>{if(k===1)return{vif:1,tol:1};const a=aux(xs.filter((_,t)=>t!==j),c);const tol=a?1-a.R2:0;return{tol,vif:tol<1e-10?Infinity:1/tol}});
  o.coef=m.beta.map((b,i)=>({nm:i?names[i-1]:'(Intercept)',b,se:m.se[i],t:m.t[i],p:m.pv[i],lo:b-tc*m.se[i],hi:b+tc*m.se[i],beta:i?b*sd(xs[i-1])/sy:null,vif:i?o.vif[i-1].vif:null,tol:i?o.vif[i-1].tol:null}));
  o.SSR=m.SST-m.SSE;o.MSR=o.SSR/k;
  o.aic=n*Math.log(m.SSE/n)+2*p;o.bic=n*Math.log(m.SSE/n)+Math.log(n)*p;
  const e=m.res;o.dw=e.slice(1).reduce((s,v,i)=>s+(v-e[i])**2,0)/m.SSE;
  const me=mean(e),s2=e.reduce((s,v)=>s+(v-me)**2,0)/n;o.skew=e.reduce((s,v)=>s+(v-me)**3,0)/n/s2**1.5;o.kurt=e.reduce((s,v)=>s+(v-me)**4,0)/n/s2**2;
  o.jb=n/6*(o.skew**2+(o.kurt-3)**2/4);o.jbp=chiP(o.jb,2);
  const bp=aux(xs,e.map(v=>v*v));o.bp=bp?n*bp.R2:NaN;o.bpp=bp?chiP(o.bp,k):NaN;
  o.stud=e.map((v,i)=>v/Math.sqrt(m.MSE*(1-h[i])));o.cook=e.map((v,i)=>v*v/(p*m.MSE)*h[i]/(1-h[i])**2);
  o.nInf=o.cook.filter(c=>c>4/n).length;
  return o}

    const sg=R.coef.slice(1).filter(c=>sig(c.p)),ns=R.coef.slice(1).filter(c=>!sig(c.p));const jn=a=>a.map(c=>esc(c.nm)).join(', ');

    so.innerHTML=`<h2>${L('ผลการวิเคราะห์การถดถอย OLS','OLS Regression Results')}</h2>

    <p><b>AIC / BIC:</b> ใช้เปรียบเทียบแบบจำลองบนข้อมูลชุดเดียวกัน ค่ายิ่งต่ำยิ่งดี (BIC ลงโทษจำนวนพารามิเตอร์มากกว่า)</p>
    <p><b>ANOVA:</b> ทดสอบว่าตัวแปรอิสระอย่างน้อยหนึ่งตัวมีอิทธิพลต่อ Y หรือไม่ (H₀: β₁ = … = βₖ = 0) ด้วย F = MS(Regression) / MS(Residual)</p>
    <p><b>B:</b> การเปลี่ยนแปลงของ Y เมื่อ X เพิ่มขึ้น 1 หน่วย โดยควบคุมตัวแปรอื่นคงที่ | <b>Beta (std.):</b> สัมประสิทธิ์มาตรฐาน ใช้เปรียบเทียบความสำคัญของตัวแปรที่มีหน่วยต่างกัน | <b>t, Sig.:</b> ทดสอบ H₀: β = 0 | <b>95% CI:</b> ช่วงความเชื่อมั่นของ B ถ้าไม่คร่อมศูนย์แสดงว่ามีนัยสำคัญ | <b>Tolerance, VIF:</b> ตรวจ Multicollinearity (VIF ≥ 10 มีปัญหา)</p>`,
    `<p><b>R, R², Adj. R²:</b> R² is the share of the variance in Y explained by the model. Adj. R² adjusts for the number of predictors and sample size, so it is better for comparing models.</p>
    <p><b>AIC / BIC:</b> used to compare models fitted to the same data; lower is better (BIC penalises the number of parameters more heavily).</p>
    <p><b>ANOVA:</b> tests whether at least one predictor affects Y (H₀: β₁ = … = βₖ = 0) using F = MS(Regression) / MS(Residual).</p>
    <p><b>B:</b> change in Y per 1-unit increase in X, holding other variables constant | <b>Beta (std.):</b> standardised coefficient, for comparing predictors measured in different units | <b>t, Sig.:</b> test of H₀: β = 0 | <b>95% CI:</b> confidence interval of B; if it excludes zero the effect is significant | <b>Tolerance, VIF:</b> multicollinearity check (VIF ≥ 10 is a problem).</p>`)}</div>`}

  const sd2=$('secDiag');

    const mv=Math.max(...R.vif.map(v=>v.vif)),dwR=R.dw<1.5?bad(L('Autocorrelation ทางบวก','Positive autocorrelation')):R.dw>2.5?bad(L('Autocorrelation ทางลบ','Negative autocorrelation')):ok(L('ไม่พบ Autocorrelation','No autocorrelation'));

     [L('ความเป็นปกติของ Residual (Jarque-Bera)','Normality of residuals (Jarque-Bera)'),f(R.jb),'χ²(2)',fp(R.jbp),sig(R.jbp)?bad(L('ไม่เป็นปกติ','Not normal')):ok(L('เป็นปกติ','Normal'))],
     [L('ความแปรปรวนคงที่ (Breusch-Pagan, Koenker)','Constant variance (Breusch-Pagan, Koenker)'),f(R.bp),`χ²(${R.k})`,fp(R.bpp),isNaN(R.bpp)?'-':sig(R.bpp)?bad('Heteroscedasticity'):ok('Homoscedasticity')],

    <div class="expl"><p>${L('OLS ให้ตัวประมาณที่ดีที่สุดในกลุ่มตัวประมาณเชิงเส้นไม่เอนเอียง (BLUE) เมื่อข้อตกลงต่อไปนี้เป็นจริง: ความสัมพันธ์เป็นเชิงเส้น, Residual มีค่าเฉลี่ยศูนย์และเป็นอิสระต่อกัน, ความแปรปรวนคงที่, ตัวแปรอิสระไม่สัมพันธ์กันเอง และ (สำหรับการทดสอบ t, F) Residual แจกแจงปกติ','OLS gives the best linear unbiased estimator (BLUE) when these assumptions hold: linearity, residuals with zero mean and independent of each other, constant variance, predictors not highly correlated with each other, and (for t and F tests) normally distributed residuals.')}</p>
    ${L(`<p><b>Jarque-Bera:</b> ทดสอบความเป็นปกติจาก Skewness และ Kurtosis (H₀: Residual เป็นปกติ) ถ้า p &lt; 0.05 แสดงว่าไม่เป็นปกติ ในตัวอย่างใหญ่ผลกระทบต่อการอนุมานมักน้อย</p>
    <p><b>Breusch-Pagan:</b> ตรวจความแปรปรวนคงที่ (H₀: Homoscedasticity) ถ้ามีนัยสำคัญควรใช้ Robust SE หรือ WLS</p>
    <p><b>Durbin-Watson:</b> ค่าใกล้ 2 = ไม่มี Autocorrelation, ต่ำกว่า 1.5 = สหสัมพันธ์ทางบวก, สูงกว่า 2.5 = ทางลบ ใช้ได้เมื่อข้อมูลเรียงตามลำดับเวลา/ลำดับการเก็บ</p>
    <p><b>VIF:</b> ตรวจ Multicollinearity | <b>Cook's D:</b> วัดว่าตัดข้อมูลแต่ละจุดออกแล้วสมการเปลี่ยนมากเพียงใด จุดที่เกิน 4/n ควรตรวจสอบว่าเป็นค่าผิดปกติหรือข้อมูลผิดพลาดหรือไม่ แต่ไม่ควรลบทิ้งโดยอัตโนมัติ</p>`,
    `<p><b>Jarque-Bera:</b> tests normality from skewness and kurtosis (H₀: residuals are normal). p &lt; 0.05 means non-normal; with large samples the impact on inference is usually small.</p>
    <p><b>Breusch-Pagan:</b> tests constant variance (H₀: homoscedasticity). If significant, use robust SE or WLS.</p>
    <p><b>Durbin-Watson:</b> near 2 = no autocorrelation, below 1.5 = positive, above 2.5 = negative. Meaningful only when rows are in time or collection order.</p>
    <p><b>VIF:</b> multicollinearity check | <b>Cook's D:</b> how much the fit changes when a point is removed. Points above 4/n should be inspected for outliers or data errors, but not deleted automatically.</p>`)}</div>`}

      ex:L('แท่งคือช่วงความเชื่อมั่น 95% ของ B และจุดสีแดงคือค่า B ที่ประมาณได้ ถ้าแท่งคร่อมศูนย์ แสดงว่าไม่มีนัยสำคัญที่ระดับ 0.05 แท่งที่แคบแสดงว่าประมาณค่าได้แม่นยำ','Bars show the 95% confidence interval of B and red dots the estimates. A bar crossing zero means the effect is not significant at 0.05; narrow bars mean precise estimates.')});
    list.push({k:'heat',l:L('Heatmap สหสัมพันธ์','Correlation heatmap'),draw:true,ex:L('แสดงค่าสหสัมพันธ์ r ของทุกคู่ตัวแปร สีแดงคือทางบวก สีน้ำเงินคือทางลบ ยิ่งเข้มยิ่งแรง ดูแถว/คอลัมน์ของ Y เพื่อหาตัวแปรที่สัมพันธ์กับ Y และดูคู่ X ที่เข้มมากเพื่อระวัง Multicollinearity','Shows r for every pair of variables: red = positive, blue = negative, darker = stronger. Read the Y row/column for relevant predictors, and watch for very dark X–X cells (multicollinearity).')});
    R.names.forEach((nm,j)=>{const x=R.xs[j],r=corr(x,R.y),sl=r*sd(R.y)/sd(x),ic=mean(R.y)-sl*mean(x),a=Math.min(...x),b=Math.max(...x);
      list.push({k:'xy'+j,l:`Y vs ${nm}`,build:()=>({type:'scatter',data:{datasets:[{label:L('ข้อมูล','Observations'),data:x.map((v,i)=>({x:v,y:R.y[i]})),backgroundColor:'rgba(46,158,107,.65)',pointRadius:4},{type:'line',label:L('เส้นถดถอยอย่างง่าย','Simple regression line'),data:[{x:a,y:ic+sl*a},{x:b,y:ic+sl*b}],borderColor:'#d64541',pointRadius:0,borderWidth:2}]},options:base(`${R.yn} vs ${nm}`,nm,R.yn)}),
      ex:L(`ความสัมพันธ์ระหว่าง ${esc(R.yn)} กับ ${esc(nm)} (r = ${f(r,3)}) เส้นสีแดงคือเส้นถดถอยอย่างง่ายที่ไม่ควบคุมตัวแปรอื่น ใช้ดูว่าความสัมพันธ์เป็นเชิงเส้นหรือไม่ และมีค่าผิดปกติหรือไม่`,`Relationship between ${esc(R.yn)} and ${esc(nm)} (r = ${f(r,3)}). The red line is the simple regression line without controlling for other variables; use it to judge linearity and spot outliers.`)})})}
  if(T!=='ols'){
    const mn=Math.min(...m.fit),mx=Math.max(...m.fit);
    list.push({k:'rvf',l:'Residuals vs Fitted',build:()=>({type:'scatter',data:{datasets:[{label:'Residual',data:m.fit.map((v,i)=>({x:v,y:m.res[i]})),backgroundColor:'rgba(47,91,234,.6)',pointRadius:4},{type:'line',label:'e = 0',data:[{x:mn,y:0},{x:mx,y:0}],borderColor:'#d64541',pointRadius:0,borderWidth:2}]},options:base('Residuals vs Fitted Values',fx,'Residual')}),
      ex:L('ตรวจความเป็นเชิงเส้นและความแปรปรวนคงที่ จุดควรกระจายสุ่มรอบเส้นศูนย์เป็นแถบกว้างสม่ำเสมอ ถ้าเป็นรูปโค้งแสดงว่าความสัมพันธ์ไม่เป็นเชิงเส้น ถ้าบานเป็นรูปกรวยแสดงว่ามี Heteroscedasticity','Checks linearity and constant variance. Points should scatter randomly around zero in an even-width band. A curve suggests non-linearity; a funnel shape suggests heteroscedasticity.')});
    const sr=[...R.stud].sort((a,b)=>a-b),N=sr.length,pts=sr.map((v,i)=>({x:qnorm((i+.5)/N),y:v})),q=[Math.min(...pts.map(p=>p.x)),Math.max(...pts.map(p=>p.x))];
    list.push({k:'qq',l:'Normal Q-Q',build:()=>({type:'scatter',data:{datasets:[{label:'Studentized residual',data:pts,backgroundColor:'rgba(155,89,182,.65)',pointRadius:4},{type:'line',label:'y = x',data:[{x:q[0],y:q[0]},{x:q[1],y:q[1]}],borderColor:'#d64541',pointRadius:0,borderWidth:2}]},options:base('Normal Q-Q Plot',L('ควอนไทล์ทางทฤษฎี (ปกติ)','Theoretical quantiles (normal)'),L('ควอนไทล์ของ Residual','Residual quantiles'))}),
      ex:L('เปรียบเทียบการแจกแจงของ Residual กับการแจกแจงปกติ ถ้าจุดเรียงตัวใกล้เส้นแดงแสดงว่า Residual เป็นปกติ ถ้าปลายทั้งสองข้างแยกออกจากเส้นแสดงว่ามีหางหนักหรือค่าผิดปกติ','Compares the residual distribution with a normal distribution. Points close to the red line indicate normal residuals; tails departing from the line indicate heavy tails or outliers.')});
    list.push({k:'hist',l:L('Histogram ของ Residual','Residual histogram'),build:()=>{const e=m.res,nb=Math.max(5,Math.ceil(Math.log2(e.length)+1)),lo=Math.min(...e),hi=Math.max(...e),w=(hi-lo)/nb||1,c=Array(nb).fill(0);e.forEach(v=>c[Math.min(nb-1,Math.floor((v-lo)/w))]++);return{type:'bar',data:{labels:c.map((_,i)=>f(lo+w*(i+.5),2)),datasets:[{label:L('ความถี่','Frequency'),data:c,backgroundColor:'rgba(47,91,234,.7)',categoryPercentage:1,barPercentage:.95}]},options:base(L('Histogram ของ Residual','Histogram of Residuals'),L('ค่า Residual (จุดกึ่งกลางช่วง)','Residual (bin midpoint)'),L('ความถี่','Frequency'))}},
      ex:L('ถ้า Residual เป็นรูประฆังคว่ำสมมาตรรอบ 0 แสดงว่าใกล้เคียงการแจกแจงปกติ ซึ่งเป็นข้อตกลงสำหรับการทดสอบ t และ F','A symmetric bell shape centred on 0 indicates approximately normal residuals, the assumption behind the t and F tests.')});
    list.push({k:'cook',l:"Cook's Distance",build:()=>({type:'bar',data:{labels:R.cook.map((_,i)=>i+1),datasets:[{label:"Cook's D",data:R.cook,backgroundColor:R.cook.map(c=>c>4/R.n?'#d64541':'#3c8dde')},lineDs('4/n',4/R.n,'#e6a23c',R.n)]},options:base("Cook's Distance",L('ลำดับข้อมูล','Observation'),"Cook's D")}),
      ex:L('แต่ละแท่งคืออิทธิพลของข้อมูลหนึ่งแถวต่อสมการถดถอย แท่งสีแดงที่เกินเส้นประ 4/n เป็นจุดที่มีอิทธิพลสูง ควรตรวจสอบว่าเป็นค่าผิดปกติหรือข้อมูลผิดพลาดหรือไม่','Each bar is the influence of one observation on the fitted regression. Red bars above the 4/n dashed line are highly influential; check whether they are outliers or data errors.')})}
  return list}

function heat(cv){const R=S.res,N=R.cn.length,cs=Math.max(54,Math.min(90,Math.floor(560/N))),ml=130,mt=110,W=ml+cs*N+20,H=mt+cs*N+20;cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#222';x.font='bold 15px sans-serif';x.textAlign='left';x.fillText(L('Heatmap เมทริกซ์สหสัมพันธ์ (r)','Correlation matrix heatmap (r)'),10,22);
  const sh=s=>s.length>14?s.slice(0,13)+'…':s;x.font='12px sans-serif';
  R.cn.forEach((nm,i)=>{x.fillStyle='#222';x.textAlign='right';x.fillText(sh(nm),ml-8,mt+i*cs+cs/2+4);x.save();x.translate(ml+i*cs+cs/2,mt-8);x.rotate(-Math.PI/4);x.textAlign='left';x.fillText(sh(nm),0,0);x.restore();
    R.cm[i].forEach((v,j)=>{const a=Math.abs(v),c=v>=0?[214,69,65]:[47,91,234];x.fillStyle=`rgb(${255-(255-c[0])*a},${255-(255-c[1])*a},${255-(255-c[2])*a})`;x.fillRect(ml+j*cs,mt+i*cs,cs-1,cs-1);x.fillStyle=a>.6?'#fff':'#222';x.textAlign='center';x.fillText(v.toFixed(2),ml+j*cs+cs/2,mt+i*cs+cs/2+4)})})}

async function getDl(){for(let i=0;i<20;i++){if(window.claude&&window.claude.use){try{return await window.claude.use('downloads')}catch(e){return null}}await new Promise(r=>setTimeout(r,150))}return null}
function anchorSave(filename,data){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function saveFile(filename,data){
  const d=await getDl();let why='';
  if(d){try{await d.save({filename,data});toast(L('บันทึกไฟล์แล้ว: ','Saved: ')+filename);return}catch(e){if(e&&e.code==='declined'){toast(L('ยกเลิกการดาวน์โหลด','Download cancelled'),true);return}why=' ('+((e&&(e.code||e.message))||'error')+')'}}
  try{anchorSave(filename,data);toast(L('กำลังดาวน์โหลด: ','Downloading: ')+filename+why)}catch(e){toast(L('ดาวน์โหลดไม่สำเร็จ','Download failed')+why,true)}}
